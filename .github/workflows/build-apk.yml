name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release with the APK'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Inject VITE_GITHUB_TOKEN
        run: echo "VITE_GITHUB_TOKEN=${{ secrets.VITE_GITHUB_TOKEN }}" > .env

      - name: Build web assets
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Set version from git tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION_NAME="${VERSION#v}"
          else
            VERSION_NAME=$(node -p "require('./package.json').version")
            VERSION="v${VERSION_NAME}"
          fi
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          VERSION_CODE=$(($(date +%s) / 60))
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cassidey-${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: List APK output
        run: ls -la android/app/build/outputs/apk/release/

      - name: Create GitHub Release
        if: >-
          (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(android/app/build/outputs/apk/release/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: No APK found in release output directory"
            exit 1
          fi
          APK_PATH="${files[0]}"
          echo "Found APK: ${APK_PATH}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ steps.version.outputs.version }}"
          fi
          # Delete existing release if it exists (for manual rebuilds)
          gh release delete "${TAG}" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "${TAG}" "${APK_PATH}" \
            --title "Cassidey ${{ steps.version.outputs.version }}" \
            --notes "Automated build from GitHub Actions" \
            --repo "${{ github.repository }}"
          # Rename the asset to a friendly name
          gh release upload "${TAG}" "${APK_PATH}#Cassidey-${{ steps.version.outputs.version }}.apk" \
            --repo "${{ github.repository }}" --clobber
